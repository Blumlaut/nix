<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forum — NIX Scoreboard</title>
  <script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.dataset.theme=t;document.documentElement.classList.add('js');}catch(e){document.documentElement.dataset.theme='light';}})();</script>
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔪</text></svg>" />
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div id="app-header"></div>
  <main>
    <div class="page-head">
      <div><h1>Forum</h1><p>Suggestions, bug reports, and nix-related discourse.</p></div>
      <div class="head-actions"><button class="btn" id="new-thread-btn">+ New Thread</button></div>
    </div>
    <section class="card hidden" id="new-thread-card">
      <h2>New Thread</h2>
      <div class="error" id="thread-error" role="alert"></div>
      <form id="new-thread-form">
        <div class="row"><input type="text" id="thread-title" placeholder="Title" maxlength="200" /></div>
        <div class="row"><textarea id="thread-body" placeholder="What's on your mind?" rows="4" maxlength="5000" style="flex:1;min-width:200px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:.95rem;font-family:inherit;resize:vertical"></textarea></div>
        <div class="row"><button type="submit" class="btn">Post Thread</button><button type="button" class="btn btn-ghost" id="cancel-thread">Cancel</button></div>
      </form>
    </section>
    <section class="card" id="thread-list-card">
      <h2>Threads</h2>
      <div class="error" id="forum-error" role="alert"></div>
      <ul class="thread-list" id="thread-list"></ul>
      <li class="empty" id="forum-empty">No threads yet. Be the first to post!</li>
    </section>
    <section class="card hidden" id="thread-detail-card"><div id="thread-detail"></div></section>
    <div class="page-foot"><a href="/">← Back to board</a></div>
  </main>
  <script src="/header.js"></script>
  <script src="/theme.js"></script>
  <script src="/forum.js"></script>
</body>
</html>
