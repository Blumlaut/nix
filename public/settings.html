<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings — NIX Scoreboard</title>
  <script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.dataset.theme=t;document.documentElement.classList.add('js');}catch(e){document.documentElement.dataset.theme='light';}})();</script>
  <link rel="stylesheet" href="/style.css" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5fa" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141822" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔪</text></svg>" />
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div id="app-header"></div>

  <main class="narrow">
    <div class="page-head">
      <div>
        <h1>Settings</h1>
        <p>Your profile and session.</p>
      </div>
    </div>

    <section class="card">
      <h2>My nix name</h2>
      <form id="rename-form" class="row">
        <input id="rename-name" type="text" maxlength="32" placeholder="New name" autocomplete="off" required />
        <button class="btn" type="submit">Save</button>
      </form>
      <p id="rename-err" class="error"></p>
      <p id="rename-ok" class="ok"></p>
    </section>

    <section class="card">
      <h2>Notifications</h2>
      <p class="push-desc">Get a browser push whenever someone is nixed — even with this tab closed.</p>
      <button id="push-toggle" class="btn" type="button" disabled>Enable nix notifications</button>
      <p id="push-status"></p>
    </section>

    <section class="card">
      <h2>Session</h2>
      <a class="logout" href="/logout">Log out</a>
    </section>
  </main>
  <footer class="page-foot">made with <a href="/nix">nix</a></footer>

  <script src="/header.js"></script>
  <script src="/theme.js"></script>
  <script src="/settings.js"></script>
</body>
</html>
