<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Changelog — NIX Scoreboard</title>
  <script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.dataset.theme=t;document.documentElement.classList.add('js');}catch(e){document.documentElement.dataset.theme='light';}})();</script>
  <link rel="stylesheet" href="/style.css" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5fa" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141822" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔪</text></svg>" />
  <style>
    main { max-width: 760px; }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div id="app-header"></div>

  <main>
    <div class="page-head">
      <div>
        <h1>Changelog</h1>
        <p>Every change to the scoreboard, straight from the git log.</p>
      </div>
    </div>

    <section class="card">
      <div id="cl-list" class="cl-list"><p class="cl-loading">Loading…</p></div>
    </section>
  </main>
  <footer class="page-foot">made with <a href="/nix">nix</a></footer>

  <script src="/header.js"></script>
  <script src="/theme.js"></script>
  <script src="/changelog.js"></script>
</body>
</html>
