name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/nix
            echo "--- git pull ---"
            git pull origin main
            echo "--- npm install ---"
            npm install --omit=dev
            echo "--- restart ---"
            systemctl restart nix-scoreboard
            sleep 2
            systemctl is-active nix-scoreboard
            echo "--- done ---"
